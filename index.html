<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapas Hisaab</title>
<meta name="theme-color" content="#0f4c35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f4ef;--card:#fff;--ink:#14231b;--mute:#6b7a71;--line:#e4e2d8;--green:#0f4c35;--gold:#b8892b;--red:#b3392f;--soft:#eaf1ec;--gb:#0f4c35;--gd:#a87d22;--rb:#b3392f}
:root[data-theme="dark"]{--bg:#0d1511;--card:#16211b;--ink:#eef3ef;--mute:#92a399;--line:#263429;--green:#3fae82;--gold:#d9a94a;--red:#e2685d;--soft:#1b2a22;--gb:#2a7f5d;--gd:#8f6a1a;--rb:#c4473c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16211b;--ink:#eef3ef;--mute:#92a399;--line:#263429;--green:#3fae82;--gold:#d9a94a;--red:#e2685d;--soft:#1b2a22;--gb:#2a7f5d;--gd:#8f6a1a;--rb:#c4473c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.ic{flex:none}
header{background:#0f4c35;color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
header h1{margin:0;font-size:19px;font-weight:700;line-height:1.2}
header .sub{opacity:.75;font-size:12.5px}
.hero{display:flex;gap:10px;margin-top:16px}
.hero div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.hero b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.hero span{font-size:12px;opacity:.8}
.hero .g b{color:#f1cf85}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:#fff;opacity:.7;padding:7px 14px;border-radius:8px;font:inherit;font-weight:700;font-size:13px}
.seg button.on{background:#fff;color:#0f4c35;opacity:1}
#cloud{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:10px;padding:8px 10px;font-family:inherit}
.ur{display:flex;gap:8px;margin-top:10px}
.ur button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:600;font-size:13px}
.ur button:disabled{opacity:.4}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mute);padding:8px 2px;border-radius:10px;font:inherit;font-weight:600;font-size:12px}
nav button.on{background:var(--gb);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,76,53,.07)}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--gd);color:#fff;font:inherit;font-weight:700;font-size:16px}
.btn.alt{background:var(--gb)}
.btn.red{background:var(--rb)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:8px}
.item:first-of-type{border-top:0}
.item .n{font-weight:600}.item small{color:var(--mute);display:block}
.rt{display:flex;align-items:center;gap:6px}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.kb{border:0;background:none;color:var(--mute);width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.kb:active{background:var(--soft)}
.tot{display:flex;justify-content:space-between;padding:12px;background:var(--soft);border-radius:10px;margin-top:10px;font-weight:700}
.pos{color:var(--red)}.ok{color:var(--green)}
.empty{color:var(--mute);text-align:center;padding:18px 0;font-size:14px}
.worker{cursor:pointer}
.det{background:var(--soft);border-radius:12px;padding:12px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats b{display:block;font-size:21px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 15px;margin:8px 8px 0 0;font:inherit;font-size:15px;font-weight:600}
.chip.on{background:var(--gb);color:#fff;border-color:var(--gb)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mb{background:var(--card);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.mb p{margin:0 0 8px;color:var(--mute);font-size:14px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 10px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;border-radius:12px;text-align:left}
.act:active{background:var(--soft)}
.act.red{color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#14231b;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center}
.av{width:38px;height:38px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.sh{font-size:13px;margin:14px 0 4px;color:var(--mute);font-weight:700}
.lr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 2px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.lr span{flex:1}
.sl{font-size:12px;color:var(--mute);margin-top:8px}
.sr{position:relative;margin-bottom:12px}
.sr .ic{position:absolute;left:12px;top:50%;margin-top:-9px;color:var(--mute)}
.sr input{padding-left:40px;font-size:15px}
.det .btn{font-size:14px;padding:12px 8px;gap:6px}
.set p{margin:0 0 4px;font-size:14px;color:var(--mute)}
#splash,#login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center}
#splash{background:#0f4c35;color:#fff;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#spArt svg{width:128px;height:128px;display:block}
#splash h1{margin:14px 0 2px;font-size:24px}
#splash p{margin:0;opacity:.7;font-size:13px}
.ld{width:48px;height:3px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:26px;overflow:hidden}
.ld i{display:block;width:40%;height:100%;background:#f1cf85;animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.ld i{animation:none}}
#login{background:#0f4c35;display:none;overflow:auto;padding:24px}
#lgBg{position:absolute;inset:0}
#lgBg svg{width:100%;height:100%;display:block}
.lc{position:relative;width:100%;max-width:380px;margin-top:62px;background:var(--card);color:var(--ink);border-radius:22px;padding:0 22px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#lgArt{width:104px;height:104px;margin:-52px auto 10px;background:#0f4c35;border-radius:50%;padding:10px;border:4px solid var(--card)}
#lgArt svg{width:100%;height:100%;display:block}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;border-radius:12px;border:1px solid #dadce0;background:#fff;color:#1f1f1f;font:inherit;font-weight:600;font-size:16px}
.gbtn:disabled{opacity:.6}
.lmsg{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
@media (prefers-reduced-motion:no-preference){
#spArt svg{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
#splash h1{animation:up .5s .25s ease both}
#splash p{animation:up .5s .4s ease both}
.lc{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#lgArt{animation:pop .6s .15s cubic-bezier(.2,.9,.3,1.2) both}
#v.in{animation:up .26s ease both}
.mo{animation:fade .2s ease both}
.mb{animation:sheet .3s cubic-bezier(.2,.8,.2,1) both}
.mo.out{animation:fadeo .16s ease both}
.mo.out .mb{animation:sheeto .16s ease both}
.mo.nr,.mo.nr .mb{animation:none}
.toast{animation:toastin .25s cubic-bezier(.2,.9,.3,1.2) both}
.toast.out{animation:toastout .2s ease both}
.btn,.chip,.kb,.act,nav button,.ur button,.seg button{transition:transform .12s ease,background-color .2s ease,opacity .2s}
.btn:active,.chip:active,.kb:active,.act:active,nav button:active{transform:scale(.96)}
.flash{animation:flash 1.4s ease-out}
.bump{animation:bump .35s ease}
.det{animation:open .22s ease both}
}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeo{to{opacity:0}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheeto{to{transform:translateY(100%)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,8px)}}
@keyframes flash{from{background:var(--soft);box-shadow:0 0 0 6px var(--soft)}to{background:transparent;box-shadow:0 0 0 6px transparent}}
@keyframes bump{50%{transform:scale(1.07)}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="splash"><div id="spArt"></div><h1>Kapas Hisaab</h1><p>Roz ka wazan, stock aur mazdoori</p><div class="ld"><i></i></div></div>
<div id="login"><div id="lgBg"></div><div class="lc"><div id="lgArt"></div><h2 style="font-size:22px;margin:0 0 6px">Kapas Hisaab</h2><p style="margin:0 0 20px;color:var(--mute);font-size:14px">Apna hisaab har phone par mehfooz rakhne ke liye login karein.</p><button class="gbtn" id="gBtn" onclick="gLogin()"><svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2045c0-.638-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.036-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z"/><path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.656 3.5795 9 3.5795z"/></svg><span>Google se login karein</span></button><div class="lmsg" id="lMsg" role="alert"></div><p style="margin:10px 0 0;color:var(--mute);font-size:12px">Ek dafa login karne ke baad app dobara login nahi maangegi.</p></div></div>
<div class="wrap">
<header>
<div class="brand"><div class="logo" id="logo"></div><div><h1>Kapas Hisaab</h1><div class="sub">Roz ka wazan, stock aur mazdoori</div></div></div>

<nav id="nav"></nav>
<div id="v"></div>
</div>

function pgH(body,n,tot){return '<div class="pg" style="position:relative;width:794px;height:1123px;padding:44px 44px 0;background:#fff;color:#14231b;font-family:Segoe UI,Noto Sans,Arial,sans-serif;overflow:hidden;box-sizing:border-box">'+body+'<div style="position:absolute;left:44px;right:44px;bottom:26px;display:flex;justify-content:space-between;font-size:11px;color:#6b7a71;border-top:1px solid #e4e2d8;padding-top:8px"><span>Kapas Hisaab · '+new Date().toLocaleDateString("en-GB")+'</span><span>Safha '+n+' / '+tot+'</span></div></div>'}
function tblH(cols,rows,tot){
var th=cols.map(function(c){return '<th style="text-align:'+c.a+';padding:9px 8px;background:#0f4c35;color:#fff;font-size:12px;font-weight:600">'+c.h+'</th>'}).join("");
var tr=rows.map(function(r,i){return '<tr style="background:'+(i%2?"#f5f7f4":"#fff")+'">'+r.map(function(v,j){return '<td dir="auto" style="text-align:'+cols[j].a+';padding:7px 8px;font-size:12.5px;border-bottom:1px solid #e4e2d8;height:30px;box-sizing:border-box">'+v+'</td>'}).join("")+'</tr>'}).join("");
var tt=tot?'<tr>'+tot.map(function(v,j){return '<td style="text-align:'+cols[j].a+';padding:10px 8px;font-size:13px;font-weight:700;background:#eaf1ec;border-top:2px solid #0f4c35">'+v+'</td>'}).join("")+'</tr>':"";
return '<table style="width:100%;border-collapse:collapse"><thead><tr>'+th+'</tr></thead><tbody>'+tr+tt+'</tbody></table>'}
function mkPdf(o){
var cap1=o.cap1||17,cap2=28,chunks=[],i=0;
chunks.push(o.rows.slice(0,cap1));i=cap1;
while(i<o.rows.length){chunks.push(o.rows.slice(i,i+cap2));i+=cap2}
var last=chunks[chunks.length-1];if(last.length>cap2-3&&chunks.length>1)chunks.push([]);
var tot=chunks.length,html=chunks.map(function(ch,n){
var isL=n===tot-1,head=n===0?
'<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0f4c35;padding-bottom:14px"><div><div style="font-size:12px;color:#6b7a71">Kapas Hisaab</div><div style="font-size:24px;font-weight:700;margin-top:2px" dir="auto">'+o.title+'</div><div style="font-size:13px;color:#6b7a71;margin-top:4px">'+o.sub+'</div></div><div style="text-align:right;font-size:12px;color:#6b7a71">Tareekh<br><b style="color:#14231b;font-size:14px">'+new Date().toLocaleDateString("en-GB")+'</b></div></div>'
+'<div style="display:flex;gap:10px;margin:16px 0 18px">'+o.sum.map(function(x){return '<div style="flex:1;border:1px solid #e4e2d8;border-radius:10px;padding:10px 12px;background:#f5f7f4"><div style="font-size:11px;color:#6b7a71">'+x[0]+'</div><div style="font-size:17px;font-weight:700;color:'+(x[2]||"#14231b")+';margin-top:2px">'+x[1]+'</div>'+(x[3]?'<div style="font-size:11px;color:#6b7a71">'+x[3]+'</div>':"")+'</div>'}).join("")+'</div>'
:'<div style="font-size:12px;color:#6b7a71;border-bottom:1px solid #e4e2d8;padding-bottom:8px;margin-bottom:12px"><b dir="auto" style="color:#14231b">'+o.title+'</b> · '+o.sub+'</div>';
return pgH(head+tblH(o.cols,ch,isL?o.tot:null)+(isL?'<div style="margin-top:34px;display:flex;justify-content:space-between;font-size:12px;color:#6b7a71"><div style="border-top:1px solid #6b7a71;padding-top:6px;width:200px">Dastakhat (Kisan)</div><div style="border-top:1px solid #6b7a71;padding-top:6px;width:200px">Dastakhat (Mazdoor)</div></div>':""),n+1,tot)}).join("");
return html}
async function pdfOut(o){
mo('<h2>PDF ban rahi hai...</h2><p>Thora intezar karein</p>');
var box=null;
try{
await libs();
box=document.createElement("div");box.style.cssText="position:fixed;left:-10000px;top:0;width:794px";box.innerHTML=mkPdf(o);document.body.appendChild(box);
if(document.fonts&&document.fonts.ready)await document.fonts.ready;
var pages=box.querySelectorAll(".pg"),pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
for(var i=0;i<pages.length;i++){var cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false});
if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297)}
var blob=pdf.output("blob");cm();
var d=null;try{d=await claude.use("downloads")}catch(e){}
if(d){try{await d.save({filename:o.file,data:blob});toast("PDF taiyar. WhatsApp par bhej sakte hain")}catch(e){if(!(e&&e.code==="declined"))toast("PDF save nahi hui")}}
else{await shareOrSave(blob,o.file)}
}catch(e){cm();toast("PDF nahi bani. Internet check karein aur dobara koshish karein")}
if(box)box.remove()}
function rep(i){var w=workers()[i],r=S.rate,run=0,rows=[],evs=[];
S.entries.filter(function(e){return e.name===w.name}).forEach(function(e){evs.push({d:e.date,k:0,id:e.id,x:e})});
S.pays.filter(function(p){return p.name===w.name}).forEach(function(p){evs.push({d:p.date,k:1,id:p.id,x:p})});
evs.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.k-b.k||a.id-b.id});
evs.forEach(function(v){if(v.k===0){run+=v.x.kg*r;rows.push([fdate(v.d),"Kapas ka wazan",fmt(v.x.kg)+" kg",money(v.x.kg*r),"",money(run)])}else{run-=v.x.amt;rows.push([fdate(v.d),"Payment ada ki","","",money(v.x.amt),money(run)])}});
var ds=evs.length?fdate(evs[0].d)+" se "+fdate(evs[evs.length-1].d):"";
pdfOut({file:"hisaab-"+w.name.replace(/[^\w؀-ۿ]+/g,"-")+"-"+today()+".pdf",title:esc(w.name),sub:"Mazdoor ka hisaab · "+ds+" · Rate Rs "+Math.round(r*40)+" per man (40 kg)",
sum:[["Kul wazan",fmt(w.kg)+" kg","",mn(w.kg)],["Kul mazdoori",money(w.earn)],["Ada kar diye",money(w.paid),"#0f4c35"],["Baqi raqam",money(w.bal),w.bal>0?"#b3392f":"#0f4c35"]],
cols:[{h:"Tareekh",a:"left"},{h:"Tafseel",a:"left"},{h:"Wazan",a:"right"},{h:"Jama (Rs)",a:"right"},{h:"Ada (Rs)",a:"right"},{h:"Baqi (Rs)",a:"right"}],
rows:rows,tot:["Total","",fmt(w.kg)+" kg",money(w.earn),money(w.paid),money(w.bal)]})}
function repAll(){var ws=workers(),t=totals();if(!ws.length){toast("Abhi koi data nahi");return}
var rows=ws.map(function(w,i){return [i+1,esc(w.name),w.nd,fmt(w.kg)+' kg<div style="font-size:10px;color:#6b7a71">'+mn(w.kg)+'</div>',money(w.earn),money(w.paid),'<b style="color:'+(w.bal>0?"#b3392f":"#0f4c35")+'">'+money(w.bal)+'</b>']});
var ds=S.entries.map(function(e){return e.date}).sort();
pdfOut({file:"poora-hisaab-"+today()+".pdf",title:"Poora hisaab",sub:"Tamam mazdoor"+(ds.length?" · "+fdate(ds[0])+" se "+fdate(ds[ds.length-1]):"")+" · Rate Rs "+Math.round(S.rate*40)+" per man (40 kg)",cap1:14,
sum:[["Maujooda stock",fmt(Math.max(0,t.kg-S.sb))+" kg","",mn(Math.max(0,t.kg-S.sb))],["Kul mazdoori",money(t.earn)],["Ada kar diye",money(t.paid),"#0f4c35"],["Baqi dena",money(t.bal),t.bal>0?"#b3392f":"#0f4c35"]],
cols:[{h:"#",a:"left"},{h:"Naam",a:"left"},{h:"Din",a:"right"},{h:"Wazan",a:"right"},{h:"Mazdoori",a:"right"},{h:"Ada",a:"right"},{h:"Baqi",a:"right"}],
rows:rows.map(function(r){r[3]=r[3];return r}),tot:["","Total",'',fmt(t.kg)+" kg",money(t.earn),money(t.paid),money(t.bal)]})}

async function doPush(){if(!cloud.doc){toast("Cloud abhi available nahi");return}cloud.st="sync";setCl();var ok=await push();toast(ok?"Backup ho gaya":"Backup nahi hua, dobara koshish karein");render()}
function takeData(x){snap();S.entries=x.entries;S.pays=x.pays;S.rate=x.rate;S.sb=x.sb;S.sbd=x.sbd;save();render()}
async function fromCloud(){if(!cloud.doc){toast("Cloud abhi available nahi");return}
try{var sn=await cloud.doc.get();if(!sn.exists){toast("Cloud mein data nahi mila");return}var x=norm(JSON.parse(sn.data().json));
yn("Is phone ka data cloud wale data se badal dein?","Haan, badal dein",function(){takeData(x)})}catch(e){toast("Cloud se data nahi aaya")}}
function restore(el){var f=el.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var x=norm(JSON.parse(rd.result));if(!x.entries.length&&!x.pays.length)throw 0;
yn(x.entries.length+" entries wapas layein? Maujooda data badal jayega.","Haan, wapas layein",function(){takeData(x)})}catch(e){toast("Yeh sahi backup file nahi hai")}};rd.readAsText(f)}
function setTh(t){S.theme=t;save();render()}
function resetStock(){yn("Stock zero kar dein? Mazdoori ka hisaab nahi badlega.","Haan, stock zero",function(){snap();S.sb=totals().kg;S.sbd=today();save();render();toast("Stock zero ho gaya. Undo se wapas aa sakta hai")})}
function clearReset(){snap();S.sb=0;S.sbd="";save();render();toast("Poora stock wapas dikh raha hai")}
function resetAll(){yn("Poora data saaf kar dein?","Haan",function(){yn("Pakka? Saari entries aur payments mit jayengi.","Haan, pakka",function(){snap();S.entries=[];S.pays=[];S.sb=0;S.sbd="";save();render();toast("Data saaf. Undo se wapas aa sakta hai")})})}

function bkV(){var t=totals(),ok=cloud.st==="ok"||cloud.st==="sync",
msg=ok?(MODE==="fb"?"Aap ke Google account se jura hua data cloud mein mehfooz hai":"Data cloud mein mehfooz hai")+(cloud.last?" (aakhri backup "+cloud.last.toLocaleTimeString()+")":"")+". Har tabdeeli ke baad khud backup hota hai.":cloud.st==="off"?(MODE==="local"?"Cloud backup abhi setup nahi hua. Setup guide ke mutabiq firebase-config.js mein apni details bharein. Tab tak file backup lein.":"Cloud backup band hai. Claude mein sign in karke link dobara kholein aur Allow dabayein. Tab tak file backup lein."):cloud.st==="err"?"Cloud backup nahi hua. Internet check karein aur neeche button dabayein.":"Cloud check ho raha hai.";
var th=[["auto","Auto","monitor"],["light","Light","sun"],["dark","Dark","moon"]].map(function(x){return '<button class="chip'+(S.theme===x[0]?" on":"")+'" onclick="setTh(\''+x[0]+'\')">'+ic(x[2],16)+x[1]+'</button>'}).join("");
var acc=(MODE==="fb"&&user)?'<div class="card set"><h2>Account</h2><div class="who">'+av(user.displayName||user.email||"U")+'<div style="min-width:0"><div class="n" style="font-weight:600">'+esc(user.displayName||"")+'</div><small style="color:var(--mute);overflow-wrap:anywhere">'+esc(user.email||"")+'</small></div></div><button class="btn line" onclick="logout()">'+ic("out",20)+'Logout</button></div>':"";
return acc+'<div class="card"><h2>Theme</h2>'+th+'</div>'
+'<div class="card set"><h2>Rate (Rs per man = 40 kg)</h2><input id="rt" type="number" inputmode="decimal" value="'+Math.round(S.rate*40)+'" onchange="setR(this.value)"><p style="margin-top:8px">Misaal: 1 man (40 kg) = Rs 1000. Rate badalne se sab ka hisaab naye rate par ban jata hai.</p></div>'
+'<div class="card set"><h2>Stock reset</h2><p>Abhi stock: <b style="color:var(--ink)">'+wt(Math.max(0,t.kg-S.sb))+'</b></p>'+(S.sb>0?'<p>Reset ('+fdate(S.sbd||today())+') se pehle ka wazan: '+wt(S.sb)+'. Mazdoori ka hisaab poore wazan par hai.</p>':'')+'<button class="btn alt" onclick="resetStock()">'+ic("reset",20)+'Stock zero karein</button>'+(S.sb>0?'<button class="btn line" onclick="clearReset()">Reset hata dein, poora stock dikhayein</button>':'')+'</div>'
+'<div class="card set"><h2>Cloud backup</h2><p>'+msg+'</p><button class="btn alt" onclick="doPush()">'+ic("up",20)+'Abhi cloud mein backup karein</button><button class="btn line" onclick="fromCloud()">'+ic("down",20)+'Cloud se data wapas layein</button></div>'
+'<div class="card set"><h2>File backup</h2><p>Hafte mein ek baar file download kar ke WhatsApp par apne aap ko bhej dein.</p><button class="btn" onclick="dl()">'+ic("down",20)+'Backup file download karein</button><label>Backup file se restore</label><input type="file" accept=".json,application/json" onchange="restore(this)"></div>'
+diagV()+'<div class="card"><h2>Khatarnak hissa</h2><button class="btn red" style="margin-top:0" onclick="resetAll()">'+ic("trash",20)+'Poora data saaf karein</button></div>';
}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button");if(b&&b.dataset.t){tab=b.dataset.t;open=null;render();swap();window.scrollTo(0,0)}};
document.getElementById("seg").onclick=function(e){var u=e.target.dataset.u;if(u){S.unit=u;ls();render()}};
document.getElementById("cloud").onclick=function(){tab="bk";render();swap()};
function haveCfg(){var c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&c.projectId&&String(c.apiKey).indexOf("YOUR")<0)}
function hideSplash(){var e=document.getElementById("splash");if(!e)return;e.classList.add("out");setTimeout(function(){e.remove()},400)}
function showLogin(m){document.getElementById("login").style.display="flex";document.getElementById("lMsg").textContent=m||"";document.getElementById("gBtn").disabled=false}
function hideLogin(){document.getElementById("login").style.display="none"}
function errMsg(e){var c=(e&&e.code)||"";if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return "Login band ho gaya. Dobara koshish karein.";if(c==="auth/network-request-failed")return "Internet check karein aur dobara koshish karein.";if(c==="auth/unauthorized-domain")return "Ye website Firebase ki Authorized domains mein shamil nahi. Setup guide dekhein.";return "Login nahi hua. Dobara koshish karein. ["+(c||(e&&e.name)||"error")+(e&&e.message?": "+String(e.message).slice(0,140):"")+"]"}
async function gLogin(){var b=document.getElementById("gBtn");if(!auth||!window.firebase||!firebase.auth){DIAG.err="auth ready nahi, sdk="+DIAG.sdk;showLogin("Firebase load nahi hua ("+(DIAG.err||"-")+"). Page dobara kholein ya normal (non-incognito) tab mein koshish karein.");return}
var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});b.disabled=true;document.getElementById("lMsg").textContent="";
try{await auth.signInWithPopup(p)}catch(e){
if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await auth.signInWithRedirect(p);return}catch(x){e=x}}
DIAG.err=(e&&e.code)||String(e);showLogin(errMsg(e))}
b.disabled=false}
function startUser(u){var prev=null;try{prev=localStorage.getItem("kapas_uid")}catch(e){}
if(prev&&prev!==u.uid){S=norm({});ls()}
try{localStorage.setItem("kapas_uid",u.uid)}catch(e){}
cloud.st="wait";setCl();attach(firebase.firestore().collection("users").doc(u.uid).collection("data").doc("hisaab"))}
function logout(){yn("Logout karein? Aap ka data cloud mein mehfooz hai, dobara login karne par wapas aa jayega.","Haan, logout",async function(){
toast("Backup ho raha hai...");var ok=await push();
if(!ok){toast("Backup nahi hua, is liye logout nahi hua. Internet check karein.");return}
try{localStorage.removeItem(KEY);localStorage.removeItem("kapas_uid")}catch(e){}
S=norm({});stk=[];rdo=[];cloud.doc=null;try{await auth.signOut()}catch(e){}render()})}
async function boot(){
var t0=Date.now();
document.getElementById("spArt").innerHTML=sprigSvg();document.getElementById("lgArt").innerHTML=sprigSvg();document.getElementById("lgBg").innerHTML=fieldSvg();
await new Promise(function(r){setTimeout(r,0)});
var fin=false;function done(){if(fin)return;fin=true;setTimeout(hideSplash,Math.max(0,900-(Date.now()-t0)))}
if(window.claude){MODE="claude";done();initCloud();return}
if(!haveCfg()){MODE="local";cloud.st="off";setCl();render();done();return}
MODE="fb";
var known=false;try{known=!!localStorage.getItem("kapas_uid")}catch(e){}
window.addEventListener("online",function(){if(cloud.doc)push()});
setTimeout(function(){if(!fin){if(known){cloud.st="err";setCl()}else showLogin("Internet nahi mila. Pehli dafa login ke liye internet chahiye.");done()}},9000);
try{
var base="https://www.gstatic.com/firebasejs/10.12.2/";
await loadJs(base+"firebase-app-compat.js");await loadJs(base+"firebase-auth-compat.js");await loadJs(base+"firebase-firestore-compat.js");DIAG.sdk="load hua";
var cfg=Object.assign({},window.FIREBASE_CONFIG);
if(/\.(web\.app|firebaseapp\.com)$/.test(location.hostname))cfg.authDomain=location.hostname;
firebase.initializeApp(cfg);auth=firebase.auth();
auth.getRedirectResult().catch(function(e){showLogin(errMsg(e))});
auth.onAuthStateChanged(function(u){fin=false;if(u){user=u;hideLogin();startUser(u)}else{user=null;cloud.doc=null;cloud.st="off";setCl();showLogin("")}done();if(tab==="bk")render()});
}catch(e){DIAG.err=String(e&&e.message||e);if(known){cloud.st="err";setCl()}else showLogin("Firebase load nahi hua ("+DIAG.err+"). Internet check karein ya normal (non-incognito) tab mein kholein.");done()}
}
render();
boot();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
